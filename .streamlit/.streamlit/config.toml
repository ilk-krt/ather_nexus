# Streamlit'in kendi tema ayarları.
# Bu dosya OLMAZSA uygulama yine çalışır, sadece Streamlit'in varsayılan kırmızı
# vurgu rengi (çoklu seçim çipleri, kaydırıcılar, odak çerçeveleri) geri gelir.
# Depoya app.py ile birlikte .streamlit/config.toml olarak koyun.

[theme]
base = "dark"
primaryColor = "#00e5ff"
backgroundColor = "#050506"
secondaryBackgroundColor = "#0d0d11"
textColor = "#ececf1"
